# 9router via Docker Compose
# Uso: make up   (ou: docker compose --env-file .env up -d)
services:
  9router:
    image: ${NINEROUTER_IMAGE:-decolua/9router:latest}
    container_name: 9router
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
      HOSTNAME: 0.0.0.0
      PORT: ${PORT:-20128}
    ports:
      # Publica só no localhost por padrão. Para expor na rede, troque por "${PORT:-20128}:${PORT:-20128}".
      - "127.0.0.1:${PORT:-20128}:${PORT:-20128}"
    volumes:
      - ${DATA_DIR_HOST:-~/.9router}:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${PORT:-20128}/ >/dev/null 2>&1 || node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||20128)).then(()=>process.exit(0)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
